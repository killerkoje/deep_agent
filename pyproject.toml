[project]
name = "deep-agent"
version = "0.5.0"
description = "SDD orchestrator - a Deep Agent harness on LangGraph"
requires-python = ">=3.11"

# Versions are pinned on purpose. LangGraph's interrupt / Command / prebuilt
# APIs have moved fast; an unpinned upgrade silently changes graph behavior.
# See docs/SPEC.md 2.1.
dependencies = [
    "langgraph==1.2.12",
    "langchain-core==1.6.5",
    "langchain-openai==1.6.6",
    "fastapi==0.121.2",
    "uvicorn[standard]==0.41.0",
    "pydantic==2.12.4",
    "python-dotenv==1.2.1",
    "httpx==0.28.1",
]

[project.scripts]
deep-agent = "deep_agent.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "jsonschema==4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
